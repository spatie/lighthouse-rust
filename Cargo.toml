[package]
name = "spatie-lighthouse"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Freek Van der Herten <freek@spatie.be>"]
description = "Run Google Lighthouse using Rust"
license = "MIT"
repository = "https://github.com/spatie/lighthouse-rust"
documentation = "https://docs.rs/spatie-lighthouse"
readme = "README.md"
keywords = ["spatie", "lighthouse", "performance", "accessibility", "chrome"]
categories = ["development-tools"]
include = ["/src/", "/tests/", "/build.rs", "/docs/", "/README.md", "/LICENSE.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/Cargo.lock"]

[dependencies]
command-group = "5.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
url = "2"

[dev-dependencies]
tiny_http = "0.12"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
strip = true
