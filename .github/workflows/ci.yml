name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: Stable / ${{ matrix.os }} / Lighthouse ${{ matrix.lighthouse }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, lighthouse: '13.6.0' }
          - { os: macos-latest, lighthouse: '13.6.0' }
          - { os: windows-latest, lighthouse: '13.6.0' }
          - { os: ubuntu-latest, lighthouse: '11.7.1' }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install legacy Lighthouse for budget compatibility
        if: matrix.lighthouse == '11.7.1'
        run: npm install --no-save --package-lock=false lighthouse@11.7.1
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Set Chrome executable
        shell: bash
        run: |
          echo 'CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}' >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --doc --all-features
      - run: cargo doc --locked --no-deps --all-features
      - run: cargo package --locked --allow-dirty

  msrv:
    name: MSRV / 1.89.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Set Chrome executable
        shell: bash
        run: |
          echo 'CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}' >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.89.0 test --locked --all-targets --all-features
      - run: cargo +1.89.0 test --locked --doc --all-features

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
